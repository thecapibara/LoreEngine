[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loreengine"
version = "0.1.1"
description = "A lightweight world-wiki engine for LLM-driven games — a zero-dependency RAG alternative"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vitaly" }]
keywords = ["llm", "games", "rag", "lore", "worldbuilding", "prompt-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
]
# No runtime dependencies — pure stdlib by design.
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/thecapibara/LoreEngine"
Repository = "https://github.com/thecapibara/LoreEngine"
Issues = "https://github.com/thecapibara/LoreEngine/issues"

[project.scripts]
loreengine-lint = "loreengine.__main__:main"

[tool.setuptools]
packages = ["loreengine"]

[tool.setuptools.package-data]
loreengine = ["py.typed"]

[tool.mypy]
# The package ships py.typed — annotations are a promise; keep them verified.
strict = true
